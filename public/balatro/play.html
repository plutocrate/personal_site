<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Balatro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='3' fill='%23fff' stroke='%23fe5f55' stroke-width='2'/%3E%3Cpath d='M16 9l5 7-5 7-5-7z' fill='%23fe5f55'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/PixelifySans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      src: url('fonts/PixelifySans-latin.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111415;
      color: #fff;
      font-family: 'Pixelify Sans', system-ui, sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111415;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .title {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: #fe5f55;
      text-shadow: 0 4px 0 #b32e26, 0 10px 25px rgba(254, 95, 85, 0.4);
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
    }

    .progress-box {
      width: min(400px, 80vw);
      background: #1a2327;
      border: 3px solid #2f3e45;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 8px 0 #0d1214;
    }

    .progress-bar {
      height: 22px;
      background: #fe5f55;
      border-radius: 6px;
      width: 0%;
      transition: width 0.15s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
    }

    .status-text {
      margin-top: 1rem;
      font-size: 1.15rem;
      color: #a4b4bb;
      text-align: center;
    }

    .top-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .top-controls:hover,
    .top-controls:focus-within {
      opacity: 1;
    }

    .ctrl-btn {
      background: #1a2327;
      border: 2px solid #2f3e45;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 3px 0 #0d1214;
      transition: all 0.1s ease;
    }

    .ctrl-btn:hover {
      background: #243137;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #0d1214;
    }

    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0d1214;
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <a href="/" class="ctrl-btn" id="portfolio-btn" title="Back to Portfolio">← Portfolio</a>
    <a href="launcher.html" class="ctrl-btn" target="_blank" rel="noopener" title="Open Launcher & Mod Manager">⚙ Launcher</a>
    <button class="ctrl-btn" id="fs-btn" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
  </div>

  <div id="loading-overlay">
    <div class="title">BALATRO</div>
    <div class="progress-box">
      <div class="progress-bar" id="p-bar"></div>
    </div>
    <div class="status-text" id="status">Loading game engine...</div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    // -------------------------------------------------------------
    // Audio Context Interceptor (Mutes completely on hidden/tab switch)
    // -------------------------------------------------------------
    const activeAudioContexts = new Set();
    const RawAudioContext = window.AudioContext || window.webkitAudioContext;

    if (RawAudioContext) {
      function InterceptedAudioContext(...args) {
        const ctx = new RawAudioContext(...args);
        activeAudioContexts.add(ctx);
        return ctx;
      }
      InterceptedAudioContext.prototype = RawAudioContext.prototype;
      window.AudioContext = InterceptedAudioContext;
      if (window.webkitAudioContext) {
        window.webkitAudioContext = InterceptedAudioContext;
      }
    }

    let isParentHidden = false;

    function muteAudio() {
      for (const ctx of activeAudioContexts) {
        try {
          if (ctx.state === "running") {
            ctx.suspend().catch(() => {});
          }
        } catch (_) {}
      }
    }

    function resumeAudio() {
      if (isParentHidden || document.hidden) return;
      for (const ctx of activeAudioContexts) {
        try {
          if (ctx.state === "suspended") {
            ctx.resume().catch(() => {});
          }
        } catch (_) {}
      }
    }

    // Message from parent SPA router when navigating between tabs/links
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "visibility") {
        isParentHidden = !!e.data.hidden;
        if (isParentHidden) {
          muteAudio();
        } else {
          resumeAudio();
        }
      }
    });

    // Browser tab switch
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        muteAudio();
      } else {
        resumeAudio();
      }
    });

    window.addEventListener("blur", () => {
      // If window lost focus to another tab/application
      if (document.hidden) muteAudio();
    });

    // Hide back to portfolio button when inside iframe
    if (window.self !== window.top) {
      const pBtn = document.getElementById("portfolio-btn");
      if (pBtn) pBtn.style.display = "none";
    }

    // Prefix IndexedDB for vanilla saves
    const PREFIX = "Balatro_vanilla_";
    const originalOpen = indexedDB.open;
    const originalDeleteDatabase = indexedDB.deleteDatabase;
    indexedDB.open = function(name, version) {
      return version !== undefined
        ? originalOpen.call(this, PREFIX + name, version)
        : originalOpen.call(this, PREFIX + name);
    };
    indexedDB.deleteDatabase = function(name) {
      return originalDeleteDatabase.call(this, PREFIX + name);
    };

    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("loading-overlay");
    const pBar = document.getElementById("p-bar");
    const statusText = document.getElementById("status");
    const fsBtn = document.getElementById("fs-btn");

    // Force canvas to always fill 100% of the iframe container
    function forceCanvasDimensions() {
      if (canvas.style.width !== "100%" || canvas.style.height !== "100%") {
        canvas.style.setProperty("width", "100%", "important");
        canvas.style.setProperty("height", "100%", "important");
        canvas.style.setProperty("top", "0px", "important");
        canvas.style.setProperty("left", "0px", "important");
        canvas.style.setProperty("position", "absolute", "important");
      }
    }
    const styleObserver = new MutationObserver(forceCanvasDimensions);
    styleObserver.observe(canvas, { attributes: true, attributeFilter: ["style"] });
    window.addEventListener("resize", forceCanvasDimensions);

    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        }).catch(() => {});
      } else {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        document.exitFullscreen().catch(() => {});
      }
    }
    fsBtn.addEventListener("click", toggleFS);
    window.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        if (e.target.tagName !== "INPUT") toggleFS();
      }
    });

    // Touch auto-fullscreen for mobile landscape
    function autoMobileFullscreen() {
      if (window.innerWidth <= 860 && !document.fullscreenElement) {
        toggleFS();
      }
      window.removeEventListener("touchstart", autoMobileFullscreen);
    }
    window.addEventListener("touchstart", autoMobileFullscreen, { passive: true });

    // Audio unlock on user interaction
    function unlockAudio() {
      resumeAudio();
      window.removeEventListener("click", unlockAudio);
      window.removeEventListener("keydown", unlockAudio);
      window.removeEventListener("touchstart", unlockAudio);
    }
    window.addEventListener("click", unlockAudio);
    window.addEventListener("keydown", unlockAudio);
    window.addEventListener("touchstart", unlockAudio);

    const CACHE_NAME = "balatro-assets-v1";

    async function loadAsset(url, label, onProgress) {
      if ("caches" in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const cachedRes = await cache.match(url);
          if (cachedRes) {
            if (label) statusText.textContent = `Loading ${label} from cache...`;
            const buf = await cachedRes.arrayBuffer();
            return new Uint8Array(buf);
          }
        } catch (e) {
          console.warn("Cache read error:", e);
        }
      }

      if (label) statusText.textContent = `Downloading ${label}...`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Could not load ${url} (HTTP ${res.status})`);

      const contentLength = +res.headers.get("Content-Length") || 0;
      let data;
      if (contentLength && res.body && window.ReadableStream) {
        const reader = res.body.getReader();
        let received = 0;
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (onProgress) onProgress(received, contentLength);
        }
        const fullArr = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) {
          fullArr.set(chunk, offset);
          offset += chunk.length;
        }
        data = fullArr;
      } else {
        const buf = await res.arrayBuffer();
        data = new Uint8Array(buf);
        if (onProgress) onProgress(data.length, data.length);
      }

      return data;
    }

    async function loadGamePackage() {
      // 1. Check browser cache first
      if ("caches" in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const cached = await cache.match("game.love");
          if (cached) {
            statusText.textContent = "Loading Balatro from browser cache...";
            pBar.style.width = "100%";
            const buf = await cached.arrayBuffer();
            return new Uint8Array(buf);
          }
        } catch (e) {
          console.warn("Cache match failed:", e);
        }
      }

      // 2. Fetch chunked parts in parallel (each < 30 MB)
      statusText.textContent = "Downloading Balatro...";
      const progress = {
        part1: { received: 0, total: 28345186 },
        part2: { received: 0, total: 28345187 }
      };

      function updateProgress() {
        const received = progress.part1.received + progress.part2.received;
        const total = progress.part1.total + progress.part2.total;
        const pct = Math.min(100, Math.round((received / total) * 100));
        pBar.style.width = pct + "%";
        const mbRec = (received / 1048576).toFixed(1);
        const mbTot = (total / 1048576).toFixed(1);
        statusText.textContent = `Downloading Balatro (${mbRec} / ${mbTot} MB)...`;
      }

      let p1, p2;
      try {
        [p1, p2] = await Promise.all([
          loadAsset("game.love.part1", null, (rec, tot) => {
            progress.part1.received = rec;
            if (tot) progress.part1.total = tot;
            updateProgress();
          }),
          loadAsset("game.love.part2", null, (rec, tot) => {
            progress.part2.received = rec;
            if (tot) progress.part2.total = tot;
            updateProgress();
          })
        ]);
      } catch (err) {
        console.warn("Chunked fetch failed, trying game.love directly:", err);
        return await loadAsset("game.love", "Balatro", (rec, tot) => {
          const pct = Math.round((rec / tot) * 100);
          pBar.style.width = pct + "%";
          const mbRec = (rec / 1048576).toFixed(1);
          const mbTot = (tot / 1048576).toFixed(1);
          statusText.textContent = `Downloading Balatro (${mbRec} / ${mbTot} MB)...`;
        });
      }

      statusText.textContent = "Assembling game files...";
      const assembled = new Uint8Array(p1.length + p2.length);
      assembled.set(p1, 0);
      assembled.set(p2, p1.length);

      // Save assembled binary into Cache Storage for instant offline/future loads
      if ("caches" in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          await cache.put("game.love", new Response(assembled.buffer, {
            headers: {
              "Content-Type": "application/zip",
              "Content-Length": String(assembled.byteLength)
            }
          }));
        } catch (e) {
          console.warn("Failed to cache assembled game.love:", e);
        }
      }

      return assembled;
    }

    async function launch() {
      try {
        const gameData = await loadGamePackage();

        statusText.textContent = "Initializing Love.js engine...";
        pBar.style.width = "100%";

        window.Module = {
          INITIAL_MEMORY: 268435456,
          canvas: canvas,
          printErr: console.error,
          arguments: ["game.love"],
          setCanvasSize: function(width, height) {
            canvas.width = width;
            canvas.height = height;
            forceCanvasDimensions();
          },
          onAbort: function(what) {
            console.error("Game aborted:", what);
            overlay.classList.remove("hidden");
            statusText.textContent = "The game stopped. Please refresh to try again.";
          },
          preRun: [
            function() {
              Module.addRunDependency("fp game.love");
              var ptr = Module.getMemory(gameData.length);
              Module['HEAPU8'].set(gameData, ptr);
              Module.FS_createDataFile('/', "game.love", gameData, true, true, true);
              Module.removeRunDependency("fp game.love");
            }
          ]
        };

        const script = document.createElement("script");
        script.src = "run/11.5/love.min.js";
        script.onload = function() {
          statusText.textContent = "Launching Balatro...";
          Love(Module);
          forceCanvasDimensions();
          setTimeout(() => {
            overlay.classList.add("hidden");
            forceCanvasDimensions();
          }, 600);
        };
        script.onerror = function() {
          statusText.textContent = "Failed to load love.min.js engine.";
        };
        document.body.appendChild(script);

      } catch (err) {
        console.error(err);
        statusText.textContent = "Error: " + err.message;
      }
    }

    launch();
  </script>
</body>
</html>
